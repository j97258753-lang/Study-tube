name: Build StudyTube APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Project & Build APK
        run: |
          mkdir -p app/src/main/java/com/studytube/app app/src/main/res/layout
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "StudyTube"
          include(":app")
          EOF
          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.studytube.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.studytube.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 5
                  versionName = "5.0"
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.0.4")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.24.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="StudyTube" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0F0F0F"
              android:padding="12dp">
              <LinearLayout
                  android:id="@+id/searchBarContainer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginBottom="8dp">
                  <EditText
                      android:id="@+id/searchInput"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:hint="Search topic or paste YouTube URL..."
                      android:textColor="#FFFFFF"
                      android:textColorHint="#888888"
                      android:background="#1E1E1E"
                      android:paddingHorizontal="12dp"
                      android:imeOptions="actionSearch"
                      android:inputType="text" />
                  <Button
                      android:id="@+id/searchBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:layout_marginStart="8dp"
                      android:text="Search"
                      android:backgroundTint="#FF0033"
                      android:textColor="#FFFFFF" />
              </LinearLayout>
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:background="#000000"
                  app:show_buffering="when_playing" />
              <HorizontalScrollView
                  android:id="@+id/controlsContainer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:scrollbars="none"
                  android:layout_marginTop="8dp">
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">
                      <Switch
                          android:id="@+id/skipSilenceSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Skip Silence  "
                          android:textColor="#FFFFFF"
                          android:checked="true" />
                      <Button
                          android:id="@+id/speedBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Speed: 1.0x"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/qualityBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Quality: 360p"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/fullscreenBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Fullscreen"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                  </LinearLayout>
              </HorizontalScrollView>
              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Search any study topic or paste a YouTube link above"
                  android:textColor="#AAAAAA"
                  android:paddingVertical="6dp" />
              <ListView
                  android:id="@+id/resultsList"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:divider="#222222"
                  android:dividerHeight="1dp" />
          </LinearLayout>
          EOF
          cat << 'EOF' > app/src/main/java/com/studytube/app/MainActivity.kt
          package com.studytube.app

          import android.content.pm.ActivityInfo
          import android.net.Uri
          import android.os.Bundle
          import android.util.TypedValue
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.MergingMediaSource
          import androidx.media3.exoplayer.source.ProgressiveMediaSource
          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.*
          import okhttp3.OkHttpClient
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.schabi.newpipe.extractor.NewPipe
          import org.schabi.newpipe.extractor.ServiceList
          import org.schabi.newpipe.extractor.downloader.Downloader
          import org.schabi.newpipe.extractor.downloader.Request
          import org.schabi.newpipe.extractor.downloader.Response
          import org.schabi.newpipe.extractor.stream.StreamInfo
          import org.schabi.newpipe.extractor.stream.StreamInfoItem
          import java.util.concurrent.TimeUnit

          @androidx.annotation.OptIn(androidx.media3.common.util.UnstableApi::class)
          class MainActivity : AppCompatActivity() {
              private lateinit var player: ExoPlayer
              private lateinit var playerView: PlayerView
              private lateinit var rootLayout: LinearLayout
              private lateinit var searchBarContainer: LinearLayout
              private lateinit var controlsContainer: HorizontalScrollView
              private lateinit var statusText: TextView
              private lateinit var resultsList: ListView
              private lateinit var qualityBtn: Button
              private lateinit var fullscreenBtn: Button

              private var currentSpeed = 1.0f
              private val speeds = listOf(1.0f, 1.25f, 1.5f, 1.75f, 2.0f)
              private var speedIdx = 0
              private val videoUrls = mutableListOf<String>()
              private val videoTitles = mutableListOf<String>()
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              private var availableQualities = listOf<Pair<String, String>>()
              private var currentAudioUrl: String? = null
              private var preferredQuality = "360p"
              private var isFullscreen = false

              class OkHttpDownloader : Downloader() {
                  private val client = OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(15, TimeUnit.SECONDS)
                      .build()

                  override fun execute(request: Request): Response {
                      val reqBuilder = okhttp3.Request.Builder()
                          .url(request.url())
                          .method(request.httpMethod(), request.dataToSend()?.toRequestBody())
                      request.headers().forEach { (k, vList) ->
                          vList.forEach { v -> reqBuilder.addHeader(k, v) }
                      }
                      if (request.headers()["User-Agent"].isNullOrEmpty()) {
                          reqBuilder.header("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
                      }
                      val resp = client.newCall(reqBuilder.build()).execute()
                      val bodyStr = resp.body?.string() ?: ""
                      return Response(resp.code, resp.message, resp.headers.toMultimap(), bodyStr, resp.request.url.toString())
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  try {
                      NewPipe.init(OkHttpDownloader())
                  } catch (_: Exception) {}

                  rootLayout = findViewById(R.id.rootLayout)
                  searchBarContainer = findViewById(R.id.searchBarContainer)
                  controlsContainer = findViewById(R.id.controlsContainer)
                  val searchInput = findViewById<EditText>(R.id.searchInput)
                  val searchBtn = findViewById<Button>(R.id.searchBtn)
                  playerView = findViewById(R.id.playerView)
                  val skipSilenceSwitch = findViewById<Switch>(R.id.skipSilenceSwitch)
                  val speedBtn = findViewById<Button>(R.id.speedBtn)
                  qualityBtn = findViewById(R.id.qualityBtn)
                  fullscreenBtn = findViewById(R.id.fullscreenBtn)
                  statusText = findViewById(R.id.statusText)
                  resultsList = findViewById(R.id.resultsList)

                  player = ExoPlayer.Builder(this).build()
                  player.skipSilenceEnabled = true
                  playerView.player = player

                  playerView.setFullscreenButtonClickListener {
                      toggleFullscreen()
                  }

                  fullscreenBtn.setOnClickListener {
                      toggleFullscreen()
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (isFullscreen) {
                              toggleFullscreen()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
                  skipSilenceSwitch.setOnCheckedChangeListener { _, isChecked ->
                      player.skipSilenceEnabled = isChecked
                      Toast.makeText(this, if (isChecked) "Skip Silence ON" else "Skip Silence OFF", Toast.LENGTH_SHORT).show()
                  }

                  speedBtn.setOnClickListener {
                      speedIdx = (speedIdx + 1) % speeds.size
                      currentSpeed = speeds[speedIdx]
                      player.playbackParameters = PlaybackParameters(currentSpeed)
                      speedBtn.text = "Speed: ${currentSpeed}x"
                  }

                  qualityBtn.setOnClickListener {
                      if (availableQualities.isEmpty()) {
                          Toast.makeText(this, "Play a video first to choose quality", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      val labels = availableQualities.map { it.first }.toTypedArray()
                      AlertDialog.Builder(this)
                          .setTitle("Select Video Quality")
                          .setItems(labels) { _, which ->
                              val chosen = availableQualities[which]
                              preferredQuality = chosen.first
                              qualityBtn.text = "Quality: ${chosen.first}"
                              val resumePos = player.currentPosition
                              val wasPlaying = player.isPlaying
                              startStream(chosen.second, currentAudioUrl, resumePos, wasPlaying)
                              Toast.makeText(this, "Switched to ${chosen.first}", Toast.LENGTH_SHORT).show()
                          }
                          .show()
                  }

                  val handleAction = {
                      val q = searchInput.text.toString().trim()
                      if (q.isNotEmpty()) {
                          if (q.contains("youtube.com/") || q.contains("youtu.be/")) {
                              playVideoUrl(q, "Custom Video Link")
                          } else {
                              statusText.text = "Searching YouTube..."
                              scope.launch {
                                  val result = searchVideos(q)
                                  result.fold(
                                      onSuccess = { found ->
                                          videoUrls.clear()
                                          videoTitles.clear()
                                          found.forEach { (url, title) -> videoUrls.add(url); videoTitles.add(title) }
                                          resultsList.adapter = object : ArrayAdapter<String>(this@MainActivity, android.R.layout.simple_list_item_1, videoTitles) {
                                              override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                                                  val view = super.getView(position, convertView, parent) as TextView
                                                  view.setTextColor(0xFFFFFFFF.toInt())
                                                  view.textSize = 14f
                                                  return view
                                              }
                                          }
                                          statusText.text = if (found.isEmpty()) "No videos found for '$q'." else "Tap a video to play:"
                                      },
                                      onFailure = { err ->
                                          statusText.text = "Search error: ${err.localizedMessage}"
                                      }
                                  )
                              }
                          }
                      }
                  }

                  searchBtn.setOnClickListener { handleAction() }
                  searchInput.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) { handleAction(); true } else false
                  }

                  resultsList.setOnItemClickListener { _, _, pos, _ ->
                      playVideoUrl(videoUrls[pos], videoTitles[pos])
                  }
              }

              private fun toggleFullscreen() {
                  isFullscreen = !isFullscreen
                  val insetsController = WindowCompat.getInsetsController(window, window.decorView)
                  insetsController.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  val params = playerView.layoutParams as LinearLayout.LayoutParams
                  if (isFullscreen) {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      insetsController.hide(WindowInsetsCompat.Type.systemBars())
                      rootLayout.setPadding(0, 0, 0, 0)
                      searchBarContainer.visibility = View.GONE
                      controlsContainer.visibility = View.GONE
                      statusText.visibility = View.GONE
                      resultsList.visibility = View.GONE
                      params.height = ViewGroup.LayoutParams.MATCH_PARENT
                      fullscreenBtn.text = "Exit Fullscreen"
                  } else {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      insetsController.show(WindowInsetsCompat.Type.systemBars())
                      val pad = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 12f, resources.displayMetrics).toInt()
                      rootLayout.setPadding(pad, pad, pad, pad)
                      searchBarContainer.visibility = View.VISIBLE
                      controlsContainer.visibility = View.VISIBLE
                      statusText.visibility = View.VISIBLE
                      resultsList.visibility = View.VISIBLE
                      params.height = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 220f, resources.displayMetrics).toInt()
                      fullscreenBtn.text = "Fullscreen"
                  }
                  playerView.layoutParams = params
              }

              private fun startStream(videoUrl: String, audioUrl: String?, seekMs: Long = 0L, autoPlay: Boolean = true) {
                  val dataSourceFactory = DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
                  val videoSource = ProgressiveMediaSource.Factory(dataSourceFactory)
                      .createMediaSource(MediaItem.fromUri(Uri.parse(videoUrl)))
                  if (audioUrl != null) {
                      val audioSource = ProgressiveMediaSource.Factory(dataSourceFactory)
                          .createMediaSource(MediaItem.fromUri(Uri.parse(audioUrl)))
                      player.setMediaSource(MergingMediaSource(videoSource, audioSource))
                  } else {
                      player.setMediaSource(videoSource)
                  }
                  player.prepare()
                  if (seekMs > 0L) {
                      player.seekTo(seekMs)
                  }
                  player.playbackParameters = PlaybackParameters(currentSpeed)
                  player.playWhenReady = autoPlay
              }

              private fun playVideoUrl(url: String, title: String) {
                  statusText.text = "Loading stream..."
                  scope.launch {
                      val streamResult = getStreams(url)
                      streamResult.fold(
                          onSuccess = { (qualities, audioUrl) ->
                              if (qualities.isEmpty()) {
                                  statusText.text = "No playable stream found for this video."
                              } else {
                                  availableQualities = qualities
                                  currentAudioUrl = audioUrl
                                  val selected = qualities.find { it.first.equals(preferredQuality, ignoreCase = true) }
                                      ?: qualities.find { it.first.contains("360") }
                                      ?: qualities.find { it.first.contains("480") }
                                      ?: qualities.last()
                                  qualityBtn.text = "Quality: ${selected.first}"
                                  statusText.text = "Playing: $title"
                                  startStream(selected.second, audioUrl, 0L, true)
                              }
                          },
                          onFailure = { err ->
                              statusText.text = "Stream error: ${err.localizedMessage}"
                          }
                      )
                  }
              }

              private suspend fun searchVideos(query: String): Result<List<Pair<String, String>>> = withContext(Dispatchers.IO) {
                  runCatching {
                      val extractor = ServiceList.YouTube.getSearchExtractor(query)
                      extractor.fetchPage()
                      extractor.initialPage.items.filterIsInstance<StreamInfoItem>().map { item ->
                          item.url to "${item.name} (${item.uploaderName})"
                      }
                  }
              }

              private suspend fun getStreams(url: String): Result<Pair<List<Pair<String, String>>, String?>> = withContext(Dispatchers.IO) {
                  runCatching {
                      val info = StreamInfo.getInfo(ServiceList.YouTube, url)
                      val audioUrl = info.audioStreams.maxByOrNull { it.averageBitrate }?.content
                      val qualityMap = linkedMapOf<String, String>()

                      if (audioUrl != null) {
                          info.videoOnlyStreams
                              .sortedByDescending { it.resolution.replace("p", "").toIntOrNull() ?: 0 }
                              .forEach { stream ->
                                  val res = stream.resolution.ifEmpty { "Unknown" }
                                  if (!qualityMap.containsKey(res)) {
                                      qualityMap[res] = stream.content
                                  }
                              }
                      }

                      if (qualityMap.isEmpty()) {
                          info.videoStreams
                              .sortedByDescending { it.resolution.replace("p", "").toIntOrNull() ?: 0 }
                              .forEach { stream ->
                                  val res = stream.resolution.ifEmpty { "Default" }
                                  if (!qualityMap.containsKey(res)) {
                                      qualityMap[res] = stream.content
                                  }
                              }
                          return@runCatching qualityMap.toList() to null
                      }

                      qualityMap.toList() to audioUrl
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
                  player.release()
              }
          }
          EOF
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload StudyTube APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
