name: Build StudyTube APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Project Files
        run: |
          python3 - << 'PYEOF'
import os, zlib, base64
files = {
    "settings.gradle.kts": "eNqtj7GKAjEQhvs8RUi126y9cMUhCorehtV+iZshxstmQjI5EPHdL4qKXHGVfzHFN/zDfMFlY/1GeWVgBE/8zHhJhIDJEkYL6Y6uMYjGQVU/wah+wM9KLyr3gk1U2oG83ZYY6bm8sAvTEMBr8MOpg4Quk8X/H9ighiYBVd1fuPhcrvv2q5ddu5rPdn03l+22fofBDfMzz9HxjzJtJQ5EIU0nk6OloIbvxqKoi9BDKyKSjHiEgRqvRig1saWsT7u8B8GsH1zWUImpCkHU7BeBfnWi",
    "build.gradle.kts": "eNoryClNz8wrVqjmUgCCzBQNpeT8XL3EvJSi/MwUvcSCgpzM5MSSzPw8JU2FstSiYiBLQclCz0jPSEkBJFupkJaYU5wK151flK6XlVqSVJQINFUvO78kJzMPZhyyEYZ6lnpGaGbUcgEABy4uNQ==",
    "gradle.properties": "eNrLL0rXSy9KTMlJ1csqy00sSi+21Y3IrTAyMLHI5UrMSynKz0zRKy1OdYQwI2xLikpTubLzS3Iy8/SS81NS9YpLKnNSbfPT0jKTMxNzuAC82B2z",
    "app/build.gradle.kts": "",
    "app/src/main/AndroidManifest.xml": "",
    "app/src/main/res/layout/activity_main.xml": "",
    "app/src/main/java/com/studytube/app/MainActivity.kt": "",
}
for path, b64 in files.items():
    os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
    with open(path, 'wb') as f:
        f.write(zlib.decompress(base64.b64decode(b64)))
          PYEOF
      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload StudyTube APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
