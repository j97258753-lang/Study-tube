name: Build StudyTube APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project Files
        run: |
          mkdir -p StudyTube/app/src/main/java/com/studytube/app
          echo "" | base64 -d > StudyTube/settings.gradle.kts
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9dHJ1ZQprb3RsaW4uY29kZS5zdHlsZT1vZmZpY2lhbAo=" | base64 -d > StudyTube/gradle.properties
          echo "cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjUuMiIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjI0IiBhcHBseSBmYWxzZQp9Cg==" | base64 -d > StudyTube/build.gradle.kts
          echo "" | base64 -d > StudyTube/app/build.gradle.kts
          echo "" | base64 -d > StudyTube/app/src/main/AndroidManifest.xml
          echo "" | base64 -d > StudyTube/app/src/main/java/com/studytube/app/MainActivity.kt

      - name: Setup Gradle & Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Debug APK
        working-directory: StudyTube
        run: gradle assembleDebug --no-daemon

      - name: Upload StudyTube APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTube-APK
          path: StudyTube/app/build/outputs/apk/debug/app-debug.apk
