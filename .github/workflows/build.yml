name: Build StudyTube APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Project & Build APK
        run: |
          mkdir -p app/src/main/java/com/studytube/app app/src/main/res/layout
          echo "" | base64 -d > settings.gradle.kts
          echo "cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjIuMiIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjIyIiBhcHBseSBmYWxzZQp9Cg==" | base64 -d > build.gradle.kts
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUKa290bGluLmNvZGUuc3R5bGU9b2ZmaWNpYWwK" | base64 -d > gradle.properties
          echo "" | base64 -d > app/build.gradle.kts
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/layout/activity_main.xml
          echo "" | base64 -d > app/src/main/java/com/studytube/app/MainActivity.kt
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload StudyTube APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
