name: Build StudyTube APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project & Build APK
        run: |
          mkdir -p StudyTube/app/src/main/java/com/studytube/app
          echo "" | base64 -d > StudyTube/settings.gradle
          echo "cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4yJyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzEuOS4yMicgYXBwbHkgZmFsc2UKfQo=" | base64 -d > StudyTube/build.gradle
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9dHJ1ZQprb3RsaW4uY29kZS5zdHlsZT1vZmZpY2lhbAo=" | base64 -d > StudyTube/gradle.properties
          echo "" | base64 -d > StudyTube/app/build.gradle
          echo "" | base64 -d > StudyTube/app/src/main/AndroidManifest.xml
          echo "" | base64 -d > StudyTube/app/src/main/java/com/studytube/app/MainActivity.kt
          cd StudyTube
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload StudyTube APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTube-APK
          path: StudyTube/app/build/outputs/apk/debug/app-debug.apk
