name: Build StudyTube APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate Project & Build APK
        run: |
          mkdir -p app/src/main/java/com/studytube/app app/src/main/res/layout
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "StudyTube"
          include(":app")
          EOF
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.studytube.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.studytube.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 8
                  versionName = "8.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlinOptions { jvmTarget = "17" }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.0.4")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("com.github.TeamNewPipe:NewPipeExtractor:v0.27.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:label="StudyTube"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/rootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0F0F0F"
              android:padding="12dp">
              <LinearLayout
                  android:id="@+id/searchBarRow"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginBottom="8dp">
                  <EditText
                      android:id="@+id/searchInput"
                      android:layout_width="0dp"
                      android:layout_height="48dp"
                      android:layout_weight="1"
                      android:hint="Search topic or paste YouTube link..."
                      android:textColor="#FFFFFF"
                      android:textColorHint="#888888"
                      android:background="#1E1E1E"
                      android:paddingHorizontal="12dp"
                      android:imeOptions="actionSearch"
                      android:inputType="text" />
                  <Button
                      android:id="@+id/searchBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:layout_marginStart="8dp"
                      android:text="Search"
                      android:backgroundTint="#FF0033"
                      android:textColor="#FFFFFF" />
              </LinearLayout>
              <androidx.media3.ui.PlayerView
                  android:id="@+id/playerView"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:background="#000000"
                  app:show_buffering="when_playing" />
              <HorizontalScrollView
                  android:id="@+id/controlsScroll"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:scrollbars="none"
                  android:layout_marginTop="8dp">
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">
                      <Switch
                          android:id="@+id/skipSilenceSwitch"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Skip Silence  "
                          android:textColor="#FFFFFF"
                          android:checked="true" />
                      <Button
                          android:id="@+id/speedBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Speed: 1.0x"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/qualityBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Quality: 360p"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/fullscreenBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Fullscreen"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/bgAudioBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Bg Audio: OFF"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/saveBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Save"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/savedListBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Saved (0)"
                          android:backgroundTint="#272727"
                          android:textColor="#FFFFFF" />
                      <Button
                          android:id="@+id/blocklistBtn"
                          android:layout_width="wrap_content"
                          android:layout_height="40dp"
                          android:layout_marginStart="8dp"
                          android:text="Blocklist"
                          android:backgroundTint="#3A1C1C"
                          android:textColor="#FFFFFF" />
                  </LinearLayout>
              </HorizontalScrollView>
              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Search any study topic or paste a YouTube link above"
                  android:textColor="#AAAAAA"
                  android:paddingVertical="6dp" />
              <ListView
                  android:id="@+id/resultsList"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:divider="#222222"
                  android:dividerHeight="1dp" />
          </LinearLayout>
          EOF
          cat << 'EOF' > app/src/main/java/com/studytube/app/MainActivity.kt
          package com.studytube.app

          import android.content.Context
          import android.content.pm.ActivityInfo
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.InputFilter
          import android.text.InputType
          import android.util.TypedValue
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackParameters
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.MergingMediaSource
          import androidx.media3.exoplayer.source.ProgressiveMediaSource
          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.*
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import org.schabi.newpipe.extractor.NewPipe
          import org.schabi.newpipe.extractor.ServiceList
          import org.schabi.newpipe.extractor.downloader.Downloader
          import org.schabi.newpipe.extractor.downloader.Response
          import org.schabi.newpipe.extractor.localization.Localization
          import org.schabi.newpipe.extractor.stream.StreamInfo
          import org.schabi.newpipe.extractor.stream.StreamInfoItem
          import org.schabi.newpipe.extractor.stream.VideoStream
          import java.util.concurrent.TimeUnit

          data class SavedVideo(val url: String, val title: String)

          @androidx.annotation.OptIn(androidx.media3.common.util.UnstableApi::class)
          class MainActivity : AppCompatActivity() {
              private lateinit var player: ExoPlayer
              private lateinit var rootLayout: LinearLayout
              private lateinit var searchBarRow: LinearLayout
              private lateinit var playerView: PlayerView
              private lateinit var controlsScroll: HorizontalScrollView
              private lateinit var statusText: TextView
              private lateinit var resultsList: ListView
              private lateinit var qualityBtn: Button
              private lateinit var fullscreenBtn: Button
              private lateinit var bgAudioBtn: Button
              private lateinit var saveBtn: Button
              private lateinit var savedListBtn: Button
              private lateinit var blocklistBtn: Button

              private var currentSpeed = 1.0f
              private val speeds = listOf(1.0f, 1.25f, 1.5f, 1.75f, 2.0f)
              private var speedIdx = 0
              private var preferredHeight = 360
              private var isFullscreen = false
              private var bgAudioEnabled = false

              private var currentVideoUrl: String? = null
              private var currentVideoTitle: String? = null
              private var currentVideoChannel: String? = null
              private var currentVideoStreams: List<VideoStream> = emptyList()
              private var currentAudioUrl: String? = null

              private val videoUrls = mutableListOf<String>()
              private val videoTitles = mutableListOf<String>()
              private val videoChannels = mutableListOf<String>()
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var newPipeInitialized = false

              private val timerHandler = Handler(Looper.getMainLooper())
              private val unlockTicker = object : Runnable {
                  override fun run() {
                      updateBlocklistButtonState()
                      if (isTemporarilyUnlocked()) {
                          timerHandler.postDelayed(this, 1000)
                      }
                  }
              }

              private class OkHttpDownloader : Downloader() {
                  private val client = OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(15, TimeUnit.SECONDS)
                      .followRedirects(true)
                      .build()

                  override fun execute(request: org.schabi.newpipe.extractor.downloader.Request): Response {
                      val reqBuilder = Request.Builder()
                          .url(request.url())
                          .header("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
                          .header("Accept-Language", "en-US,en;q=0.9")

                      request.headers().forEach { (key, values) ->
                          values.forEach { value -> reqBuilder.addHeader(key, value) }
                      }

                      val dataToSend = request.dataToSend()
                      if (request.httpMethod() == "POST") {
                          val body = (dataToSend ?: ByteArray(0)).toRequestBody(null)
                          reqBuilder.post(body)
                      } else {
                          reqBuilder.get()
                      }

                      val resp = client.newCall(reqBuilder.build()).execute()
                      val bodyStr = resp.body?.string() ?: ""
                      return Response(resp.code, resp.message, resp.headers.toMultimap(), bodyStr, resp.request.url.toString())
                  }
              }

              private fun ensureNewPipe(forceReset: Boolean = false) {
                  if (!newPipeInitialized || forceReset) {
                      NewPipe.init(OkHttpDownloader(), Localization.DEFAULT)
                      newPipeInitialized = true
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ensureNewPipe()
                  setContentView(R.layout.activity_main)

                  rootLayout = findViewById(R.id.rootLayout)
                  searchBarRow = findViewById(R.id.searchBarRow)
                  val searchInput = findViewById<EditText>(R.id.searchInput)
                  val searchBtn = findViewById<Button>(R.id.searchBtn)
                  playerView = findViewById(R.id.playerView)
                  controlsScroll = findViewById(R.id.controlsScroll)
                  val skipSilenceSwitch = findViewById<Switch>(R.id.skipSilenceSwitch)
                  val speedBtn = findViewById<Button>(R.id.speedBtn)
                  qualityBtn = findViewById(R.id.qualityBtn)
                  fullscreenBtn = findViewById(R.id.fullscreenBtn)
                  bgAudioBtn = findViewById(R.id.bgAudioBtn)
                  saveBtn = findViewById(R.id.saveBtn)
                  savedListBtn = findViewById(R.id.savedListBtn)
                  blocklistBtn = findViewById(R.id.blocklistBtn)
                  statusText = findViewById(R.id.statusText)
                  resultsList = findViewById(R.id.resultsList)

                  updateSavedCount()
                  updateBlocklistButtonState()

                  player = ExoPlayer.Builder(this).build()
                  player.skipSilenceEnabled = true
                  playerView.player = player

                  playerView.setFullscreenButtonClickListener {
                      toggleFullscreen()
                  }

                  fullscreenBtn.setOnClickListener {
                      toggleFullscreen()
                  }

                  bgAudioBtn.setOnClickListener {
                      bgAudioEnabled = !bgAudioEnabled
                      if (bgAudioEnabled) {
                          player.setWakeMode(C.WAKE_MODE_NETWORK)
                          bgAudioBtn.text = "Bg Audio: ON"
                          bgAudioBtn.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#1B5E20"))
                          Toast.makeText(this, "Background audio ON (keeps playing when screen locks)", Toast.LENGTH_SHORT).show()
                      } else {
                          player.setWakeMode(C.WAKE_MODE_NONE)
                          bgAudioBtn.text = "Bg Audio: OFF"
                          bgAudioBtn.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#272727"))
                          Toast.makeText(this, "Background audio OFF", Toast.LENGTH_SHORT).show()
                      }
                  }

                  saveBtn.setOnClickListener {
                      val url = currentVideoUrl
                      val title = currentVideoTitle
                      if (url != null && title != null) {
                          toggleBookmark(url, title)
                      } else {
                          Toast.makeText(this, "Play a video first to save it", Toast.LENGTH_SHORT).show()
                      }
                  }

                  savedListBtn.setOnClickListener {
                      showSavedVideosDialog()
                  }

                  blocklistBtn.setOnClickListener {
                      handleBlocklistClick()
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (isFullscreen) {
                              toggleFullscreen()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })

                  skipSilenceSwitch.setOnCheckedChangeListener { _, isChecked ->
                      player.skipSilenceEnabled = isChecked
                      Toast.makeText(this, if (isChecked) "Skip Silence ON" else "Skip Silence OFF", Toast.LENGTH_SHORT).show()
                  }

                  speedBtn.setOnClickListener {
                      speedIdx = (speedIdx + 1) % speeds.size
                      currentSpeed = speeds[speedIdx]
                      player.playbackParameters = PlaybackParameters(currentSpeed)
                      speedBtn.text = "Speed: ${currentSpeed}x"
                  }

                  qualityBtn.setOnClickListener {
                      showQualityDialog()
                  }

                  val doSearch = {
                      val q = searchInput.text.toString().trim()
                      if (q.isNotEmpty()) {
                          if (q.startsWith("http://") || q.startsWith("https://") || q.contains("youtu.be/") || q.contains("youtube.com/")) {
                              val cleanUrl = if (q.startsWith("http")) q else "https://$q"
                              playVideoFromUrl(cleanUrl, "Direct Link")
                          } else {
                              statusText.text = "Searching YouTube..."
                              scope.launch {
                                  try {
                                      val found = searchYouTube(q)
                                      videoUrls.clear()
                                      videoTitles.clear()
                                      videoChannels.clear()
                                      var hiddenCount = 0
                                      found.forEach { (url, title, channel) ->
                                          if (isChannelBlocked(channel)) {
                                              hiddenCount++
                                          } else {
                                              videoUrls.add(url)
                                              videoTitles.add(title)
                                              videoChannels.add(channel)
                                          }
                                      }
                                      val displayItems = videoTitles.mapIndexed { idx, title ->
                                          val ch = videoChannels.getOrElse(idx) { "" }
                                          if (ch.isNotEmpty()) "$title  •  $ch" else title
                                      }
                                      resultsList.adapter = object : ArrayAdapter<String>(this@MainActivity, android.R.layout.simple_list_item_1, displayItems) {
                                          override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                                              val view = super.getView(position, convertView, parent) as TextView
                                              view.setTextColor(Color.WHITE)
                                              view.textSize = 14f
                                              view.setPadding(16, 20, 16, 20)
                                              return view
                                          }
                                      }
                                      statusText.text = when {
                                          displayItems.isEmpty() && hiddenCount > 0 -> "All results were blocked by Parent Blocklist."
                                          displayItems.isEmpty() -> "No results found. Try different keywords."
                                          hiddenCount > 0 -> "Tap a video to play ($hiddenCount blocked channel video(s) hidden):"
                                          else -> "Tap a video to play:"
                                      }
                                  } catch (e: Exception) {
                                      statusText.text = "Search error: ${e.message ?: "Check internet"}"
                                  }
                              }
                          }
                      }
                  }

                  searchBtn.setOnClickListener { doSearch() }
                  searchInput.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_SEARCH) { doSearch(); true } else false
                  }

                  resultsList.setOnItemClickListener { _, _, pos, _ ->
                      playVideoFromUrl(videoUrls[pos], videoTitles[pos])
                  }
              }

              private fun getPrefs() = getSharedPreferences("studytube_prefs", Context.MODE_PRIVATE)

              private fun getParentPin(): String? = getPrefs().getString("parent_pin", null)

              private fun isTemporarilyUnlocked(): Boolean {
                  val until = getPrefs().getLong("unlock_until", 0L)
                  return System.currentTimeMillis() < until
              }

              private fun getBlockedChannels(): MutableList<String> {
                  val raw = getPrefs().getString("blocked_channels", "[]") ?: "[]"
                  val list = mutableListOf<String>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          list.add(arr.getString(i))
                      }
                  } catch (_: Exception) {}
                  return list
              }

              private fun saveBlockedChannels(list: List<String>) {
                  val arr = JSONArray()
                  list.forEach { arr.put(it) }
                  getPrefs().edit().putString("blocked_channels", arr.toString()).apply()
              }

              private fun isChannelBlocked(channelName: String?): Boolean {
                  if (channelName.isNullOrBlank()) return false
                  if (isTemporarilyUnlocked()) return false
                  val clean = channelName.trim()
                  return getBlockedChannels().any { it.trim().equals(clean, ignoreCase = true) }
              }

              private fun updateBlocklistButtonState() {
                  val until = getPrefs().getLong("unlock_until", 0L)
                  val remaining = until - System.currentTimeMillis()
                  if (remaining > 0) {
                      val mins = (remaining / 1000) / 60
                      val secs = (remaining / 1000) % 60
                      blocklistBtn.text = String.format("Unlocked (%02d:%02d)", mins, secs)
                      blocklistBtn.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#E65100"))
                  } else {
                      if (until > 0L) {
                          getPrefs().edit().putLong("unlock_until", 0L).apply()
                          val playingCh = currentVideoChannel
                          if (playingCh != null && isChannelBlocked(playingCh)) {
                              player.stop()
                              player.clearMediaItems()
                              currentVideoUrl = null
                              currentVideoTitle = null
                              currentVideoChannel = null
                              updateSaveButtonState()
                              statusText.text = "15-min unlock expired. Blocked channel stopped."
                              Toast.makeText(this, "15-min unlock expired — channel blocked again", Toast.LENGTH_LONG).show()
                          }
                      }
                      val count = getBlockedChannels().size
                      blocklistBtn.text = if (count > 0) "Blocklist ($count)" else "Blocklist"
                      blocklistBtn.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#3A1C1C"))
                  }
              }

              private fun handleBlocklistClick() {
                  val savedPin = getParentPin()
                  if (savedPin == null) {
                      showCreatePinDialog()
                  } else {
                      showVerifyPinDialog(savedPin)
                  }
              }

              private fun showCreatePinDialog() {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 24, 48, 8)
                  }
                  val pin1 = EditText(this).apply {
                      hint = "Enter 4-digit Parent PIN"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      filters = arrayOf(InputFilter.LengthFilter(4))
                  }
                  val pin2 = EditText(this).apply {
                      hint = "Confirm 4-digit Parent PIN"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      filters = arrayOf(InputFilter.LengthFilter(4))
                  }
                  container.addView(pin1)
                  container.addView(pin2)

                  AlertDialog.Builder(this)
                      .setTitle("Set Parent 4-Digit PIN")
                      .setMessage("Only parents should know this PIN. It locks the channel blocklist and controls 15-minute temporary unlocks.")
                      .setView(container)
                      .setPositiveButton("Save PIN") { _, _ ->
                          val p1 = pin1.text.toString().trim()
                          val p2 = pin2.text.toString().trim()
                          if (p1.length == 4 && p1 == p2) {
                              getPrefs().edit().putString("parent_pin", p1).apply()
                              Toast.makeText(this, "Parent PIN saved!", Toast.LENGTH_SHORT).show()
                              showManageBlocklistDialog()
                          } else {
                              Toast.makeText(this, "PINs must be 4 digits and match", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showVerifyPinDialog(savedPin: String) {
                  val pinInput = EditText(this).apply {
                      hint = "Enter 4-digit Parent PIN"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      filters = arrayOf(InputFilter.LengthFilter(4))
                  }
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 24, 48, 8)
                      addView(pinInput)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Parent PIN Required")
                      .setView(container)
                      .setPositiveButton("Verify") { _, _ ->
                          if (pinInput.text.toString().trim() == savedPin) {
                              showManageBlocklistDialog()
                          } else {
                              Toast.makeText(this, "Incorrect Parent PIN", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showManageBlocklistDialog() {
                  val blocked = getBlockedChannels()
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 20, 40, 10)
                  }

                  val addRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  val channelInput = EditText(this).apply {
                      hint = "Exact channel name..."
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val addBtn = Button(this).apply {
                      text = "Block"
                  }
                  addRow.addView(channelInput)
                  addRow.addView(addBtn)
                  container.addView(addRow)

                  val listLabel = TextView(this).apply {
                      text = if (blocked.isEmpty()) "No channels blocked yet." else "Tap a channel below to unblock it:"
                      setPadding(0, 20, 0, 8)
                  }
                  container.addView(listLabel)

                  val listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  container.addView(listContainer)

                  fun refreshChannelRows() {
                      listContainer.removeAllViews()
                      val current = getBlockedChannels()
                      listLabel.text = if (current.isEmpty()) "No channels blocked yet." else "Tap a channel below to unblock it:"
                      current.forEach { ch ->
                          val rowBtn = Button(this).apply {
                              text = "✕  $ch"
                              isAllCaps = false
                              setOnClickListener {
                                  val updated = getBlockedChannels()
                                  updated.remove(ch)
                                  saveBlockedChannels(updated)
                                  updateBlocklistButtonState()
                                  refreshChannelRows()
                                  Toast.makeText(this@MainActivity, "Unblocked: $ch", Toast.LENGTH_SHORT).show()
                              }
                          }
                          listContainer.addView(rowBtn)
                      }
                  }
                  refreshChannelRows()

                  addBtn.setOnClickListener {
                      val name = channelInput.text.toString().trim()
                      if (name.isNotEmpty()) {
                          val updated = getBlockedChannels()
                          if (!updated.any { it.equals(name, ignoreCase = true) }) {
                              updated.add(name)
                              saveBlockedChannels(updated)
                              updateBlocklistButtonState()
                              refreshChannelRows()
                              channelInput.setText("")
                              Toast.makeText(this, "Blocked: $name", Toast.LENGTH_SHORT).show()
                              if (isChannelBlocked(currentVideoChannel)) {
                                  player.stop()
                                  player.clearMediaItems()
                                  currentVideoUrl = null
                                  currentVideoTitle = null
                                  currentVideoChannel = null
                                  updateSaveButtonState()
                                  statusText.text = "Stopped: channel added to Parent Blocklist."
                              }
                          }
                      }
                  }

                  val scroll = ScrollView(this).apply { addView(container) }
                  val builder = AlertDialog.Builder(this)
                      .setTitle("Parent Blocklist Manager")
                      .setView(scroll)
                      .setPositiveButton("Unlock 15 Min") { _, _ ->
                          val unlockUntil = System.currentTimeMillis() + (15 * 60 * 1000L)
                          getPrefs().edit().putLong("unlock_until", unlockUntil).apply()
                          timerHandler.removeCallbacks(unlockTicker)
                          timerHandler.post(unlockTicker)
                          Toast.makeText(this, "All channels unlocked for 15 minutes", Toast.LENGTH_LONG).show()
                      }
                      .setNegativeButton("Done", null)

                  if (isTemporarilyUnlocked()) {
                      builder.setNeutralButton("Lock Now") { _, _ ->
                          getPrefs().edit().putLong("unlock_until", 0L).apply()
                          updateBlocklistButtonState()
                          Toast.makeText(this, "Blocklist locked immediately", Toast.LENGTH_SHORT).show()
                      }
                  } else {
                      builder.setNeutralButton("Change PIN") { _, _ ->
                          showCreatePinDialog()
                      }
                  }

                  builder.show()
              }

              private fun getSavedVideos(): MutableList<SavedVideo> {
                  val raw = getPrefs().getString("saved_videos", "[]") ?: "[]"
                  val list = mutableListOf<SavedVideo>()
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val obj = arr.getJSONObject(i)
                          list.add(SavedVideo(obj.getString("url"), obj.getString("title")))
                      }
                  } catch (_: Exception) {}
                  return list
              }

              private fun saveVideosList(list: List<SavedVideo>) {
                  val arr = JSONArray()
                  list.forEach {
                      val obj = JSONObject()
                      obj.put("url", it.url)
                      obj.put("title", it.title)
                      arr.put(obj)
                  }
                  getPrefs().edit().putString("saved_videos", arr.toString()).apply()
                  updateSavedCount()
                  updateSaveButtonState()
              }

              private fun isBookmarked(url: String?): Boolean {
                  if (url == null) return false
                  return getSavedVideos().any { it.url == url }
              }

              private fun toggleBookmark(url: String, title: String) {
                  val list = getSavedVideos()
                  val existingIdx = list.indexOfFirst { it.url == url }
                  if (existingIdx >= 0) {
                      list.removeAt(existingIdx)
                      Toast.makeText(this, "Removed from Saved", Toast.LENGTH_SHORT).show()
                  } else {
                      list.add(0, SavedVideo(url, title))
                      Toast.makeText(this, "Video Saved!", Toast.LENGTH_SHORT).show()
                  }
                  saveVideosList(list)
              }

              private fun updateSavedCount() {
                  val count = getSavedVideos().size
                  savedListBtn.text = "Saved ($count)"
              }

              private fun updateSaveButtonState() {
                  if (isBookmarked(currentVideoUrl)) {
                      saveBtn.text = "Saved ✓"
                      saveBtn.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#1565C0"))
                  } else {
                      saveBtn.text = "Save"
                      saveBtn.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#272727"))
                  }
              }

              private fun showSavedVideosDialog() {
                  val saved = getSavedVideos()
                  if (saved.isEmpty()) {
                      Toast.makeText(this, "No saved videos yet. Tap Save while watching a lecture!", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val titles = saved.map { it.title }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Saved Lectures (${saved.size})")
                      .setItems(titles) { _, which ->
                          val chosen = saved[which]
                          playVideoFromUrl(chosen.url, chosen.title)
                      }
                      .setNeutralButton("Delete One") { _, _ ->
                          AlertDialog.Builder(this)
                              .setTitle("Tap a video to delete")
                              .setItems(titles) { _, delIdx ->
                                  val updated = getSavedVideos()
                                  updated.removeAt(delIdx)
                                  saveVideosList(updated)
                                  Toast.makeText(this, "Deleted from Saved", Toast.LENGTH_SHORT).show()
                              }
                              .setNegativeButton("Cancel", null)
                              .show()
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              private fun toggleFullscreen() {
                  isFullscreen = !isFullscreen
                  val controller = WindowCompat.getInsetsController(window, window.decorView)
                  if (isFullscreen) {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                      controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      searchBarRow.visibility = View.GONE
                      controlsScroll.visibility = View.GONE
                      statusText.visibility = View.GONE
                      resultsList.visibility = View.GONE
                      rootLayout.setPadding(0, 0, 0, 0)
                      playerView.layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      fullscreenBtn.text = "Exit Full"
                  } else {
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      controller.show(WindowInsetsCompat.Type.systemBars())
                      searchBarRow.visibility = View.VISIBLE
                      controlsScroll.visibility = View.VISIBLE
                      statusText.visibility = View.VISIBLE
                      resultsList.visibility = View.VISIBLE
                      val pad = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 12f, resources.displayMetrics).toInt()
                      val heightPx = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 220f, resources.displayMetrics).toInt()
                      rootLayout.setPadding(pad, pad, pad, pad)
                      playerView.layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          heightPx
                      )
                      fullscreenBtn.text = "Fullscreen"
                  }
              }

              private fun showQualityDialog() {
                  if (currentVideoStreams.isEmpty()) {
                      Toast.makeText(this, "Play a video first to select quality", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val distinctStreams = currentVideoStreams
                      .distinctBy { it.height }
                      .sortedBy { it.height }

                  val labels = distinctStreams.map { "${it.height}p (${it.format?.name ?: "MP4"})" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Select Video Quality")
                      .setItems(labels) { _, which ->
                          val chosen = distinctStreams[which]
                          preferredHeight = chosen.height
                          qualityBtn.text = "Quality: ${preferredHeight}p"
                          val pos = player.currentPosition
                          val wasPlaying = player.isPlaying
                          startExoPlayback(chosen.content, currentAudioUrl, pos, wasPlaying)
                          Toast.makeText(this, "Switched to ${preferredHeight}p", Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              private fun pickBestVideoStream(streams: List<VideoStream>): VideoStream? {
                  if (streams.isEmpty()) return null
                  return streams.minByOrNull { kotlin.math.abs(it.height - preferredHeight) }
              }

              private fun startExoPlayback(videoUrl: String, audioUrl: String?, seekPosMs: Long, autoPlay: Boolean) {
                  val dataSourceFactory = DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
                      .setAllowCrossProtocolRedirects(true)

                  val videoSource = ProgressiveMediaSource.Factory(dataSourceFactory)
                      .createMediaSource(MediaItem.fromUri(Uri.parse(videoUrl)))

                  if (audioUrl != null) {
                      val audioSource = ProgressiveMediaSource.Factory(dataSourceFactory)
                          .createMediaSource(MediaItem.fromUri(Uri.parse(audioUrl)))
                      player.setMediaSource(MergingMediaSource(videoSource, audioSource))
                  } else {
                      player.setMediaSource(videoSource)
                  }
                  player.prepare()
                  if (seekPosMs > 0) player.seekTo(seekPosMs)
                  player.playbackParameters = PlaybackParameters(currentSpeed)
                  player.playWhenReady = autoPlay
              }

              private fun playVideoFromUrl(url: String, fallbackTitle: String) {
                  statusText.text = "Loading video stream..."
                  scope.launch {
                      try {
                          val info = fetchStreamInfoWithRetry(url)
                          val channelName = info.uploaderName ?: ""
                          if (isChannelBlocked(channelName)) {
                              statusText.text = "Blocked: \"$channelName\" is locked by Parent Blocklist."
                              Toast.makeText(this@MainActivity, "Channel \"$channelName\" is blocked by parents", Toast.LENGTH_LONG).show()
                              return@launch
                          }

                          val title = info.name ?: fallbackTitle
                          currentVideoUrl = url
                          currentVideoTitle = title
                          currentVideoChannel = channelName
                          updateSaveButtonState()

                          val allVideoOnly = info.videoOnlyStreams.filter { it.content.isNotEmpty() }
                          val allMuxed = info.videoStreams.filter { it.content.isNotEmpty() }
                          val audioStream = info.audioStreams.maxByOrNull { it.averageBitrate }

                          if (allVideoOnly.isNotEmpty() && audioStream != null) {
                              currentVideoStreams = allVideoOnly
                              currentAudioUrl = audioStream.content
                              val chosen = pickBestVideoStream(allVideoOnly)!!
                              qualityBtn.text = "Quality: ${chosen.height}p"
                              statusText.text = "Playing (${chosen.height}p): $title"
                              startExoPlayback(chosen.content, currentAudioUrl, 0L, true)
                          } else if (allMuxed.isNotEmpty()) {
                              currentVideoStreams = allMuxed
                              currentAudioUrl = null
                              val chosen = pickBestVideoStream(allMuxed)!!
                              qualityBtn.text = "Quality: ${chosen.height}p"
                              statusText.text = "Playing (${chosen.height}p): $title"
                              startExoPlayback(chosen.content, null, 0L, true)
                          } else {
                              statusText.text = "No playable stream found for this video."
                          }
                      } catch (e: Exception) {
                          statusText.text = "Stream error: ${e.message ?: "Try another video"}"
                      }
                  }
              }

              private suspend fun fetchStreamInfoWithRetry(url: String): StreamInfo = withContext(Dispatchers.IO) {
                  var lastErr: Exception? = null
                  for (attempt in 1..3) {
                      try {
                          if (attempt > 1) {
                              ensureNewPipe(forceReset = true)
                              delay(600L * attempt)
                          }
                          return@withContext StreamInfo.getInfo(ServiceList.YouTube, url)
                      } catch (e: Exception) {
                          lastErr = e
                      }
                  }
                  throw lastErr ?: RuntimeException("Unable to load stream")
              }

              private suspend fun searchYouTube(query: String): List<Triple<String, String, String>> = withContext(Dispatchers.IO) {
                  var lastErr: Exception? = null
                  for (attempt in 1..2) {
                      try {
                          if (attempt > 1) ensureNewPipe(forceReset = true)
                          val extractor = ServiceList.YouTube.getSearchExtractor(query)
                          extractor.fetchPage()
                          val list = mutableListOf<Triple<String, String, String>>()
                          for (item in extractor.initialPage.items) {
                              if (item is StreamInfoItem) {
                                  list.add(Triple(item.url, item.name, item.uploaderName ?: ""))
                              }
                          }
                          return@withContext list
                      } catch (e: Exception) {
                          lastErr = e
                      }
                  }
                  throw lastErr ?: RuntimeException("Search failed")
              }

              override fun onPause() {
                  super.onPause()
                  if (!bgAudioEnabled) {
                      player.pause()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  timerHandler.removeCallbacks(unlockTicker)
                  scope.cancel()
                  player.release()
              }
          }
